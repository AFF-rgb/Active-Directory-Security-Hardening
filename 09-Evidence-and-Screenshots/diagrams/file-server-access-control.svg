<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071a30"/><stop offset="1" stop-color="#123d61"/></linearGradient>
 <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#164d78"/><stop offset="1" stop-color="#0d3152"/></linearGradient>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#f4f8fc}.title{font-size:39px;font-weight:700}.subtitle{font-size:19px;fill:#b8d0e4}.h{font-size:25px;font-weight:700}.body{font-size:20px}.small{font-size:16px}.tiny{font-size:14px}.muted{fill:#b8d0e4}.dark{fill:#0a2945}.card{fill:url(#blue);stroke:#4c9bd0;stroke-width:2}.light{fill:#eaf5ff;stroke:#83c2ec;stroke-width:2}.line{stroke:#78c6ff;stroke-width:4;fill:none}.green{fill:#b8f3d0}.red{fill:#ffd0d0}.tag{fill:#09243d;stroke:#3b83b4;stroke-width:1.5}
