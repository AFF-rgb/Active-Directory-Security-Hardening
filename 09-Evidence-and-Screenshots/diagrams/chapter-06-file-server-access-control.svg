<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675"><rect width="1200" height="675" fill="#0b1220"/><text x="70" y="78" fill="#eef4fb" font-family="Segoe UI,Arial,sans-serif" font-size="38" font-weight="700">Chapter 06 | File Server Access Control</text><text x="70" y="125" fill="#a9bdd2" font-family="Segoe UI,Arial,sans-serif" font-size="21">Separating IT and HR file access with SMB, NTFS permissions, ABE, and Group Policy mapping</text><path d="M70 160H1130" stroke="#35516f" stroke-width="2"/><rect x="70" y="210" width="247" height="230" rx="18" fill="#142238" stroke="#35516f" stroke-width="2"/><rect x="70" y="210" width="247" height="9" rx="4" fill="#72a9f5"/><text x="92" y="258" fill="#eef4fb" font-size="23" font-weight="700">Shared location</text><text x="92" y="304" fill="#a9bdd2" font-size="18">CompanyData$ hidden SMB share</text><text x="92" y="338" fill="#a9bdd2" font-size="18">Mapped as Z: via GPO</text><path d="M322 325h14" stroke="#72a9f5" stroke-width="3"/><path d="M329 318l9 7-9 7" stroke="#72a9f5" stroke-width="3" fill="none"/><rect x="341" y="210" width="247" height="230" rx="18" fill="#142238" stroke="#35516f" stroke-width="2"/><rect x="341" y="210" width="247" height="9" rx="4" fill="#55c2a5"/><text x="363" y="258" fill="#eef4fb" font-size="23" font-weight="700">Department ACLs</text><text x="363" y="304" fill="#a9bdd2" font-size="18">IT_Share → GG_IT_Staff</text><text x="363" y="338" fill="#a9bdd2" font-size="18">HR_Share → GG_HR_Staff</text><path d="M593 325h14" stroke="#72a9f5" stroke-width="3"/><path d="M600 318l9 7-9 7" stroke="#72a9f5" stroke-width="3" fill="none"/><rect x="612" y="210" width="247" height="230" rx="18" fill="#142238" stroke="#35516f" stroke-width="2"/><rect x="612" y="210" width="247" height="9" rx="4" fill="#f2c16b"/><text x="634" y="258" fill="#eef4fb" font-size="23" font-weight="700">Visibility + security</text><text x="634" y="304" fill="#a9bdd2" font-size="18">ABE hides inaccessible folders</text><text x="634" y="338" fill="#a9bdd2" font-size="18">NTFS ACLs enforce authorization</text><path d="M864 325h14" stroke="#72a9f5" stroke-width="3"/><path d="M871 318l9 7-9 7" stroke="#72a9f5" stroke-width="3" fill="none"/><rect x="883" y="210" width="247" height="230" rx="18" fill="#142238" stroke="#35516f" stroke-width="2"/><rect x="883" y="210" width="247" height="9" rx="4" fill="#72a9f5"/><text x="905" y="258" fill="#eef4fb" font-size="23" font-weight="700">User validation</text><text x="905" y="304" fill="#a9bdd2" font-size="18">IT and HR write tests passed</text><text x="905" y="338" fill="#a9bdd2" font-size="18">Cross-department access denied</text><rect x="70" y="520" width="1060" height="72" rx="14" fill="#192d46" stroke="#35516f"/><text x="95" y="563" fill="#55c2a5" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">ILLUSTRATIVE DESIGN — NOT A SCREENSHOT OR INDEPENDENT VALIDATION</text><text x="70" y="635" fill="#a9bdd2" font-family="Segoe UI,Arial,sans-serif" font-size="15">Active Directory Security Hardening • stech.net lab</text></svg>